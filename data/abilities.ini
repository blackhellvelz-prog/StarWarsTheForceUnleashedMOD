; Новые способности (не стоковые). Открываются навыками, вешаются на 4 слота (по умолчанию F1-F4).
; effects = список через ';'. Формат каждого эффекта:
;   heal:%макс.здоровья            force:%макс.Силы
;   regen:здоровье/с:Сила/с:сек    dr:%снижения урона:сек
;   shield:поглощение:сек          timescale:скорость_времени:сек
;   killheal:%здоровья:%Силы:сек   (за каждое убийство пока действует)
;   xpboost:%опыта:сек             hp2force:%тек.здоровья:%макс.Силы
;   aoe:радиус:урон                (нужен CapAreaDamage — функция движка, см. docs/RE_GUIDE.md)
;   dmgboost:%урона:сек            (нужен CapDamageScale — хук урона)

[ability.battle_meditation]
name = Боевая медитация
desc = Вы черпаете спокойствие в бою: регенерация здоровья и Силы, урон по вам снижен.
forceCost = 30
cooldown = 40
effects = regen:8:6:6; dr:25:6

[ability.force_barrier]
name = Барьер Силы
desc = Сфера Силы поглощает до 250 урона в течение 12 секунд.
forceCost = 40
cooldown = 35
effects = shield:250:12

[ability.dark_transfer]
name = Тёмный обмен
desc = Боль питает тьму: 30% текущего здоровья превращаются в 60% энергии Силы.
forceCost = 0
cooldown = 20
effects = hp2force:30:60

[ability.drain_aura]
name = Аура похищения
desc = 15 секунд каждое убийство возвращает 6% здоровья и 8% Силы.
forceCost = 25
cooldown = 45
effects = killheal:6:8:15

[ability.time_stasis]
name = Стазис времени
desc = Сила замедляет течение времени вокруг вас в 2,5 раза на 5 секунд.
forceCost = 50
cooldown = 60
effects = timescale:0.4:5

[ability.jedi_focus]
name = Сосредоточение джедая
desc = Мгновенно восполняет 60% Силы; 30 секунд +50% опыта.
forceCost = 0
cooldown = 90
effects = force:60; xpboost:50:30

[ability.recovery]
name = Исцеление Силой
desc = Восстанавливает 40% здоровья.
forceCost = 35
cooldown = 50
effects = heal:40

[ability.sith_fury]
name = Ярость ситха
desc = 10 секунд +40% урона и +25% опыта. Требует найденного хука урона (CapDamageScale).
forceCost = 45
cooldown = 50
reqLevel = 15
effects = dmgboost:40:10; xpboost:25:10

[ability.force_storm]
name = Буря Силы
desc = Вихрь Силы наносит 150 урона всем врагам в радиусе 6 м. Требует функции урона по области (CapAreaDamage).
forceCost = 70
cooldown = 30
reqLevel = 22
effects = aoe:6:150
