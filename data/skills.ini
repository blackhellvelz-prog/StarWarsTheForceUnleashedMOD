; Деревья навыков. perRank — бонус за каждый ранг (ключи как в balance.ini).
; requires = id[:ранг], ...   grantsAbility — способность из abilities.ini, открывается на 1-м ранге.

[trees]
order = dark, light, blade, survival

; ---------------------------------------------------------------- Тёмная сторона
[skill.dark_initiate]
name = Посвящение во тьму
tree = dark
desc = Открывает «Тёмный обмен». Каждое убийство питает вашу Силу.
grantsAbility = dark_transfer
perRank = killForcePct 2

[skill.hatred]
name = Ненависть
tree = dark
maxRank = 3
requires = dark_initiate
desc = Гнев делает удары тяжелее, а каждая победа лечит.
perRank = damageBonusPct 4, killHealPct 1

[skill.force_hunger]
name = Голод Силы
tree = dark
reqLevel = 8
requires = hatred:2
desc = Открывает «Ауру похищения».
grantsAbility = drain_aura
perRank = killHealPct 1

[skill.sith_fury]
name = Путь ситха
tree = dark
reqLevel = 15
requires = force_hunger
desc = Открывает «Ярость ситха».
grantsAbility = sith_fury
perRank = xpBonusPct 5

[skill.storm_lord]
name = Повелитель бури
tree = dark
reqLevel = 22
cost = 2
requires = sith_fury
desc = Открывает «Бурю Силы».
grantsAbility = force_storm
perRank = maxForcePct 10

; ---------------------------------------------------------------- Светлая сторона
[skill.light_initiate]
name = Путь света
tree = light
desc = Открывает «Боевую медитацию». Тело медленно исцеляется само.
grantsAbility = battle_meditation
perRank = hpRegen 0.5

[skill.serenity]
name = Безмятежность
tree = light
maxRank = 3
requires = light_initiate
desc = Сила восстанавливается быстрее.
perRank = forceRegen 0.8

[skill.barrier]
name = Щит веры
tree = light
reqLevel = 6
requires = serenity
desc = Открывает «Барьер Силы».
grantsAbility = force_barrier
perRank = damageReductionPct 3

[skill.jedi_focus]
name = Сосредоточение
tree = light
reqLevel = 10
requires = serenity:2
desc = Открывает «Сосредоточение джедая».
grantsAbility = jedi_focus
perRank = xpBonusPct 5

[skill.time_master]
name = Повелитель мгновения
tree = light
reqLevel = 14
requires = barrier
desc = Открывает «Стазис времени».
grantsAbility = time_stasis
perRank = cooldownPct 5

; ---------------------------------------------------------------- Мастер клинка
[skill.saber_forms]
name = Формы боя на мечах
tree = blade
maxRank = 5
desc = Каждый ранг: +3% урона и немного здоровья за убийство.
perRank = damageBonusPct 3, killHealPct 0.5

[skill.djem_so]
name = Форма V: Джем Со
tree = blade
maxRank = 3
requires = saber_forms:2
desc = Стойкая форма: меньше урона по вам.
perRank = damageReductionPct 4

[skill.ataru]
name = Форма IV: Атару
tree = blade
maxRank = 3
requires = saber_forms:2
desc = Акробатическая форма: способности быстрее перезаряжаются.
perRank = cooldownPct 4

[skill.juyo]
name = Форма VII: Джуйо
tree = blade
reqLevel = 18
cost = 2
requires = djem_so:3, ataru:1
desc = Форма на грани тьмы: больше опыта и Силы за каждое убийство.
perRank = xpBonusPct 10, killForcePct 3

; ---------------------------------------------------------------- Выживание
[skill.toughness]
name = Закалка
tree = survival
maxRank = 5
desc = +6% максимального здоровья за ранг.
perRank = maxHealthPct 6

[skill.force_well]
name = Источник Силы
tree = survival
maxRank = 5
desc = +6% максимальной энергии Силы за ранг.
perRank = maxForcePct 6

[skill.recovery]
name = Самоисцеление
tree = survival
requires = toughness
desc = Открывает «Исцеление Силой».
grantsAbility = recovery
perRank = hpRegen 0.3

[skill.efficiency]
name = Экономия Силы
tree = survival
maxRank = 3
requires = force_well:2
desc = Новые способности дешевле.
perRank = abilityCostPct 8

[skill.second_wind]
name = Второе дыхание
tree = survival
reqLevel = 12
requires = toughness:3
desc = При здоровье ниже 12% мгновенно восстанавливает половину (раз в 2 минуты).
perRank = lastStand 1
