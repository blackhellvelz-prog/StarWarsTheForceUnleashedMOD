; Баланс прокачки. Все числа можно менять без пересборки: плагин перечитывает data/ при старте игры.
[balance]
maxLevel = 50
; опыт для уровня N -> N+1 = xpBase * xpGrowth^(N-1)
xpBase = 100
xpGrowth = 1.11
attrPointsPerLevel = 3
skillPointsPerLevel = 1
; XP = прирост стоковых «очков Силы» (Force Points) * xpPerForcePoint * множители.
; Откалибруйте по своей сборке: посмотрите в tfu_rpg.log, сколько очков даёт обычный штурмовик.
xpPerForcePoint = 1.0
; Скачок счётчика больше этого — загрузка сохранения/меню, а не убийство.
maxForcePointDelta = 4000
; Перекачанный персонаж получает меньше опыта на лёгких локациях (за каждый уровень выше рекомендуемого).
overlevelPenaltyPerLevel = 0.12
minLocationXpFactor = 0.15
; Недокачанный — больше (за каждый уровень ниже рекомендуемого, максимум x2).
underlevelBonusPerLevel = 0.05
crystalDropChance = 0.04
inventorySize = 24
; Пассивка «Второе дыхание»
lastStandThresholdPct = 12
lastStandHealPct = 50
lastStandCooldown = 120

; Что даёт одно очко характеристики.
[attributes]
might = damageBonusPct 2, killHealPct 0.2
vitality = maxHealthPct 3, hpRegen 0.1
force = maxForcePct 3, forceRegen 0.15
agility = cooldownPct 1, xpBonusPct 0.5
