; Галактическая карта: все локации игры связаны в один мир вокруг корабля «Разбойная тень».
; levelMatch  — подстроки внутреннего имени уровня, по которым мод понимает, где вы находитесь.
;               ВНИМАНИЕ: это предположения. Плагин пишет реальное имя каждого загруженного уровня
;               в tfu_rpg.log — сверьте и поправьте (см. docs/RE_GUIDE.md, шаг 5).
; travelLevel — имя, которое передаётся функции загрузки уровня (CapLoadLevel). Пусто/не настроено —
;               мод показывает маршрут и просит выбрать миссию в стоковом меню.
; links       — маршруты (двусторонние). tier — рекомендуемый уровень персонажа.
; Разблокировка: startUnlocked, либо reqLevel + reqQuest, либо просто побывать там.

